[workspace]
resolver = "2"
members = [
    "crates/upload-concurrency",
    "crates/objcas",
    "crates/chunkfmt",
    "crates/platform-lite",
    "crates/csi-common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/replicix/replicix-core"

# Versions are the ones the sibling projects' lockfiles resolve; Cargo.lock
# is committed and was seeded from the Constellation lockfile at the
# extraction commit (see each crate's PROVENANCE.md). Crates whose version
# changes bytes on the wire or error text are pinned with `=`.
[workspace.dependencies]
replicix-upload-concurrency = { path = "crates/upload-concurrency", version = "0.1.0" }
replicix-objcas = { path = "crates/objcas", version = "0.1.0" }
replicix-chunkfmt = { path = "crates/chunkfmt", version = "0.1.0" }
replicix-platform-lite = { path = "crates/platform-lite", version = "0.1.0" }
replicix-csi-common = { path = "crates/csi-common", version = "0.1.0" }

tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "net"] }
object_store = { version = "=0.14.1", features = ["aws"] }
blake3 = "=1.8.7"
zstd = "=0.13.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bytes = "1.12.1"
futures = "0.3.34"
async-trait = "0.1.92"
rand = "0.9.5"
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
tracing = "0.1.44"
aws-config = "1.11.0"
aws-credential-types = "1.3.0"
aws-types = "1.5.0"
chacha20poly1305 = "=0.11.0"
argon2 = "=0.6.0"
zeroize = "1.9.0"
region = "4.0.0"
libc = "0.2.189"
tempfile = "3.27.0"
lz4_flex = { version = "=0.13.1", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "router", "server", "transport"] }
tonic-prost = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.2.0"
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
