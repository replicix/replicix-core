[package]
name = "replicix-csi-common"
description = "CSI v1 bindings, StorageClass parameter helpers, volume-id codecs and the credentials Secret watch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = ["kube-secrets"]
# The Kubernetes API implementation of `SecretSource`.
kube-secrets = ["dep:kube", "dep:k8s-openapi"]
# Expose the in-memory `credentials::fake` Secret source to other crates' tests.
test-support = []

[dependencies]
async-trait.workspace = true
blake3.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
